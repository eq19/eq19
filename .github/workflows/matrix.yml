name: Freqtrade Hyperopt Matrix

on:
  workflow_dispatch:
    inputs:
      matrix_json:
        description: "Matrix JSON (as string)"
        required: true

jobs:
  run-hyperopt:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJson(inputs.matrix_json).config }}

    env:
      GH_TOKEN: ${{ secrets.ACCESS_TOKEN }}
      PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}

    steps:
      - name: 📥 Checkout Repo
        uses: actions/checkout@v4

      - name: 🧠 Run Hyperopt
        run: |
          echo "Running hyperopt..."
          echo "Strategy: ${{ matrix.config.strategy }}"
          echo "Loss Type: ${{ matrix.config.loss }}"
          echo "Space: ${{ matrix.config.space }}"

          # Example Command:
          # freqtrade hyperopt \
          #   --strategy ${{ matrix.config.strategy }} \
          #   --spaces ${{ matrix.config.space }} \
          #   --hyperopt-loss ${{ matrix.config.loss }} \
          #   --config user_data/config.json
